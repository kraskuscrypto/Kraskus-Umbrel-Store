kraskus-quantus-solo:
- replaces:
  - 6f5e0f8badaee55e
  - 0d5e3cfda90c0da1
  description: Quantus Solo runs a Quantus mainnet full node on your own hardware and lets your Quantus
    miners on the local network mine to your own wormhole reward address. You import the reward address
    and its inner hash; the app checks that they belong together and never asks for your 24 words. An
    optional local CPU miner is included for testing only; it is not profitable on mainnet. Upstream telemetry
    is turned off. Kraskus Quantus Solo includes a 1% developer fee. One out of every 100 block heights
    is assigned to the Kraskus developer reward identity; all other heights use your configured reward
    identity. Because solo mining rewards depend on when blocks are actually found, your realized fee
    percentage over a short period may differ from 1%. Kraskus Quantus Solo uses the official Quantus
    node source as its base. Kraskus applies a disclosed developer-fee modification to block-template
    reward selection. The miner remains unmodified.
- replaces:
  - 908e81097e1e6acd
  description: Quantus Solo runs a Quantus mainnet full node on Umbrel and lets your Quantus miners on
    the local network mine to your own wormhole reward address. The node syncs without a reward address
    or wallet-backup confirmation; reward setup is required only for mining. You import the reward address
    and its inner hash; the app checks that they belong together and never asks for your 24 words. On
    first run you add the reward identity in the app; changing it later, rotating the miner token or regenerating
    its TLS certificate needs the platform's secure login. An optional local CPU miner is included for
    testing only; it is not profitable on mainnet. Upstream telemetry is turned off. Kraskus Quantus Solo
    includes a 1% developer fee. One out of every 100 block heights is assigned to the Kraskus developer
    reward identity; all other heights use your configured reward identity. Because solo mining rewards
    depend on when blocks are actually found, your realized fee percentage over a short period may differ
    from 1%. Kraskus Quantus Solo uses the official Quantus node source as its base. Kraskus applies a
    disclosed developer-fee modification to block-template reward selection. The miner remains unmodified.
kraskus-xmr-solo:
- replaces:
  - 472d2a27ba78ebc4
  description: Monero by Kraskus runs a self-contained Monero node, wallet, and true solo mining appliance.
    XMRig connects to a RandomX Stratum endpoint on port 1921, with real worker, share, hashrate, and
    submitted-difficulty telemetry while only network-valid blocks are forwarded to the local monerod.
    Wallet state and blockchain data remain in the app's persistent storage. An automatic 1% developer
    fee applies only to successfully mined block rewards after 60-block maturity; miner hashrate is never
    diverted.
- replaces:
  - 681bad73f26e0b18
  description: Monero by Kraskus runs a self-contained Monero node, wallet, and true solo mining appliance.
    The wallet has a 25-word recovery phrase (or watch-only with the secret view key) and a wallet password
    that protects backup, send and forget. XMRig connects to a RandomX Stratum endpoint on port 1921,
    with real worker, share, hashrate, and submitted-difficulty telemetry while only network-valid blocks
    are forwarded to the local monerod. Wallet state and blockchain data remain in the app's persistent
    storage. An automatic 1% developer fee applies only to successfully mined block rewards after 60-block
    maturity; miner hashrate is never diverted.
- replaces:
  - 001490046ca0a6c9
  description: 'BEFORE UPDATING: send any crypto held in the app native wallet to another wallet you control,
    confirm receipt, and back up the old wallet and recovery information. This version removes native-wallet
    access from the app. Never delete legacy wallet data or assume uninstalling will preserve it. Run
    a Monero node and connect your RandomX miners on TCP 1921. Use an external primary address or subaddress
    you control. Each found block pays 99% directly to that address and a separate fixed 1% developer
    output, rounded down to whole piconero. No hashrate is diverted and the app never requests your seed
    or private keys. Includes live worker telemetry, hashrate history, block records, appearance choices
    and read-only chain lookup. Native-wallet access is removed. Existing wallet files are preserved during
    an upgrade; they are never deleted, automatically swept or exposed by this app. Kraskus Pool remains
    under development.'
kraskus-zec-solo:
- replaces:
  - 96e77c205182a699
  description: Kraskus ZEC Solo runs an easy-to-use Zcash full node and local solo mining appliance on
    your own hardware. The app manages node synchronization, mining readiness, worker connections, mining
    jobs, and block submissions from a single interface. Normal users do not need to manage Zebra, RPC,
    Docker, Linux, JSON, or Stratum configuration.
- replaces:
  - 1a3474dd9161a35f
  description: 'Zcash by Kraskus runs a self-contained Zcash Mainnet full node (Zebra), the Zallet wallet
    and an Equihash 200,9 solo-mining server on the Kraskus V3 interface. It shows node synchronization,
    one truthful mining-readiness state, workers, shares and node-confirmed blocks. Miners connect on
    port 3335; no work is issued until the node is synchronized and a payout is configured. The built-in
    wallet is created or restored with a 24-word recovery phrase, protected by a wallet password, and
    can receive, send and act as the mining payout; your own transparent t-address can be used instead.
    Zebra needs about 320 GiB of free storage for Mainnet; on a smaller host the app reports it and does
    not start syncing. A required 1% developer fee is paid directly from successful block coinbases. This
    is the pre-NU7 release: a follow-up update is required for the Zcash NU7 network upgrade.'
- replaces:
  - efc02ef30de25476
  description: 'BEFORE UPDATING FROM A NATIVE-WALLET RELEASE: send all holdings to a wallet you control
    and keep a verified recovery backup. Native-wallet controls are removed. Never delete legacy wallet
    data. Run a Zcash node and solo mine to your external wallet. Monitor synchronization, workers, solution
    rate and found blocks in a simple dashboard. Connect Equihash (200,9) miners on port 3335. Mining
    stays paused until you enter and confirm a transparent P2PKH (t1) payout address and explicitly start
    it. The fixed 1% developer fee applies to the miner-controlled reward; required network allocations
    are unchanged. There is no built-in wallet, seed prompt, send function or automatic shielding. Existing
    wallet files and funds are preserved through the protected migration. The existing 320 GiB Mainnet
    storage preflight and pre-NU7 compatibility limits remain enforced; this release does not update the
    node or add pruning. Kraskus Pool remains under development.'
- replaces:
