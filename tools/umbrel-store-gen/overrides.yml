# Reviewed platform-neutral listing variants; versions, fees, warnings and destinations come from source.
kraskus-bsv-solo:
- replaces:
  - d673bfc20e818520
  description: Bitcoin SV runs a self-contained BSV mainnet node (SV Node 1.2.2, pruned, 10 GB excessive
    block size) and a native GMC-to-Stratum V1 solo-mining controller on port 1922. The Kraskus interface
    shows node synchronization, one truthful mining-readiness state, workers, shares and blocks confirmed
    by the node. Miners are refused until the node is synchronized and a valid payout is configured; plain
    Stratum V1 miners and ASICs that use version rolling (BIP310 / ASICBoost) are supported. The built-in
    wallet receives mining payouts once you have downloaded and verified an encrypted backup of the complete
    wallet file; the same backup restores the exact wallet on any install. A wallet password set at the
    end of wallet set-up protects backups, Forget and payout changes. Sending from the built-in wallet
    is not available. A required 1% developer fee is paid directly from each successful block coinbase.
    Even pruned, the Bitcoin SV node needs several hundred GB of disk (about 650 GB today).
- replaces:
  - 289dfe242a8f451c
  description: 'BEFORE UPDATING FROM A NATIVE-WALLET RELEASE: send all holdings to a wallet you control
    and keep a verified recovery backup. Native-wallet controls are removed. Never delete legacy wallet
    data. Bitcoin SV mainnet node and solo Stratum controller, with external payout address and a required1%
    developer fee paid directly in the coinbase. SV Node1.2.2 and the existing chain configuration are
    retained. Simple Home, Mining, Blocks, Blockchain and Settings pages; themes, live worker telemetry
    and safe pruning controls. No user-facing native wallet. Existing wallet files are preserved during
    migration. Mining starts paused; set an external payout address and wait for node readiness before
    choosing Start mining. Kraskus Pool forwarding is under development. '
- replaces:
  - f1dcad35a793fd95
  description: 'Bitcoin SV mainnet node and solo Stratum controller, with external payout address and
    a required1% developer fee paid directly in the coinbase. SV Node1.2.2 and the existing chain configuration
