# Umbrel store-listing copy, applied by generate.py to every Umbrel store.
#
# Allowed fields: name, tagline, description, releaseNotes. IDs, versions, ports
# and everything else always come from the 5tratumOS source manifest.
#
# `replaces` lists the fingerprints of the source copy (name, tagline,
# description) this text was written against. When the source copy changes,
# generation stops until the Umbrel copy here has been reviewed and the new
# fingerprint added. Copy must stay platform-neutral: no 5tratumOS/Workbench
# wording (validate.py enforces this).

kraskus-bsv-solo:
  replaces: [d673bfc20e818520]
  description: >-
    Bitcoin SV runs a self-contained BSV mainnet node (SV Node 1.2.2, pruned, 10 GB
    excessive block size) and a native GMC-to-Stratum V1 solo-mining controller on
    port 1922. The Kraskus interface shows node synchronization, one truthful
    mining-readiness state, workers, shares and blocks confirmed by the node. Miners
    are refused until the node is synchronized and a valid payout is configured; plain
    Stratum V1 miners and ASICs that use version rolling (BIP310 / ASICBoost) are
    supported. The
    built-in wallet receives mining payouts once you have downloaded and verified an
    encrypted backup of the complete wallet file; the same backup restores the exact
    wallet on any install. A wallet password set at the end of wallet set-up protects
    backups, Forget and payout changes. Sending from the built-in wallet is not
    available. A required 1% developer fee is paid directly from each successful
    block coinbase. Even pruned, the Bitcoin SV node needs several hundred GB of disk
    (about 650 GB today).

kraskus-chta-solo:
  # Main 0.3.1 source copy: the reviewed Umbrel copy published on Umbrel Main
  # (restored verbatim from before 2f4c63c merged both fingerprints into one text).
  - replaces: [e6d60d2983b5ef87]
    description: >-
      CHTA Kraskus runs a self-contained CheetahCoin full node and solo-mining
      appliance. The Kraskus interface shows node synchronization, one truthful
      mining-readiness state, each Stratum port's live status, workers, accepted and
      rejected shares, round progress, and blocks independently confirmed by the node.
      Normal miners connect on port 1926; NMMiner and other very-low-hash devices use
      port 1927 with a fixed 0.002 difficulty. Both ports stay closed until the node is
      synchronized and a valid payout is configured. The built-in CheetahCoin wallet
      can receive, send and act as the mining payout once you have downloaded and
      verified an encrypted backup of the complete wallet file; the same backup
      restores the exact wallet on any CHTA Kraskus install. A required 1% developer
      fee is paid directly from successful block coinbases.
  # Dev 0.5.0 (Kraskus Apps V3) source copy.
  - replaces: [65bec8d9f71b1963]
    description: >-
      CHTA Kraskus runs a self-contained CheetahCoin full node and solo-mining
      appliance. The Kraskus interface shows node synchronization, one truthful
      mining-readiness state, workers, accepted and rejected shares, and blocks
      independently confirmed by the node. Normal miners connect on port 1926;
      NMMiner and other very-low-hash devices use port 1927 with a fixed 0.002
      difficulty. Both ports stay closed until the node is synchronized and a valid
      payout is configured. The built-in CheetahCoin wallet can receive, send and act
      as the mining payout once you have downloaded and verified an encrypted backup of
      the complete wallet file; the same backup restores the exact wallet, and a wallet
      password protects sending, payout changes and Forget. A required 1% developer
      fee is paid directly from successful block coinbases.

kraskus-common-foundry-gpu-miner:
  replaces: [f07c9c4c58adeb27]
  description: >-
    Mines Common Foundry on a supported NVIDIA GPU with the official v1.0.8 miner,
    unmodified, behind the Kraskus interface (CMFD Kraskus). The app downloads and
    authenticates its own copy of the 6.4 GB ForgeMatrix model bank, mines to the
    pool you choose and pays out to the Common Foundry address you enter. It holds
    no wallet and never asks for a passphrase. Mining requires an NVIDIA GPU with the
    NVIDIA driver loaded on the host; the app asks for GPU access when you install
    it. Works with or without the Common Foundry node app. Pool mining only. No
    developer fee.

kraskus-kaspa-solo:
  replaces: [85a8f599948d440d]
  description: >-
    Kaspa by Kraskus runs an easy-to-use Kaspa full node and local solo mining
    appliance on your own hardware. The app manages node synchronization, mining
    readiness, worker connections, a real native Kaspa wallet, and confirmed block
    detection from a single interface. Normal users do not need to manage kaspad,
    RPC, Docker, Linux, JSON, or Stratum configuration. An automatic 1% developer fee
    applies only to successfully mined block rewards after coinbase maturity; miner
    hashrate is never diverted.

kraskus-prl-solo:
  replaces: [af103adef89ddb0a, 923a26d2788e1758]
  description: >-
    Pearl by Kraskus runs a real Pearl v1.4.8 mainnet node, the native Oyster wallet
    and the Kraskus Pearl Stratum gateway on port 1902, with truthful readiness:
    miners get work only once the node is synchronized and a payout is ready. The
    built-in wallet shows its recovery phrase once and confirms it with a word
    challenge before mining can pay it; a wallet password protects it, and the
    wallet can be restored from the phrase or forgotten. A verified found-blocks
    ledger and live worker and share telemetry are included. Sending from the
    built-in wallet is not available. A required 1% developer fee is paid directly
    from each successful block coinbase.

kraskus-quantus-solo:
  # Written against the 0.3.0 dev-fee listing (owner decisions 2026-10-10). The
  # earlier fingerprint (cdba319319a5d82a, "No developer fee") is dropped on
  # purpose: this copy must never be applied to a source without the fee.
  # 0.3.1 (2026-10-11): the source copy now says the first reward identity is set in the app; this
  # platform-neutral copy names no login rule, so it stays accurate (reviewed).
  replaces: [6f5e0f8badaee55e, 0d5e3cfda90c0da1]
  description: >-
    Quantus Solo runs a Quantus mainnet full node on your own hardware and lets your
    Quantus miners on the local network mine to your own wormhole reward address.
    You import the reward address and its inner hash; the app checks that they
    belong together and never asks for your 24 words. An optional local CPU miner is
    included for testing only; it is not profitable on mainnet. Upstream telemetry is
    turned off. Kraskus Quantus Solo includes a 1% developer fee. One out of every 100
    block heights is assigned to the Kraskus developer reward identity; all other
    heights use your configured reward identity. Because solo mining rewards depend
    on when blocks are actually found, your realized fee percentage over a short
    period may differ from 1%. Kraskus Quantus Solo uses the official Quantus node
    source as its base. Kraskus applies a disclosed developer-fee modification to
    block-template reward selection. The miner remains unmodified.

kraskus-xmr-solo:
  # 0.1.x source copy.
  - replaces: [472d2a27ba78ebc4]
    description: >-
      Monero by Kraskus runs a self-contained Monero node, wallet, and true solo mining
      appliance. XMRig connects to a RandomX Stratum endpoint on port 1921, with real
      worker, share, hashrate, and submitted-difficulty telemetry while only
      network-valid blocks are forwarded to the local monerod. Wallet state and
      blockchain data remain in the app's persistent storage. An automatic 1% developer
      fee applies only to successfully mined block rewards after 60-block maturity;
      miner hashrate is never diverted.
  # 0.2.0 (Kraskus Apps V3) source copy.
  - replaces: [681bad73f26e0b18]
    description: >-
      Monero by Kraskus runs a self-contained Monero node, wallet, and true solo mining
      appliance. The wallet has a 25-word recovery phrase (or watch-only with the secret
      view key) and a wallet password that protects backup, send and forget. XMRig
      connects to a RandomX Stratum endpoint on port 1921, with real worker, share,
      hashrate, and submitted-difficulty telemetry while only network-valid blocks are
      forwarded to the local monerod. Wallet state and blockchain data remain in the
      app's persistent storage. An automatic 1% developer fee applies only to
      successfully mined block rewards after 60-block maturity; miner hashrate is never
      diverted.

kraskus-zec-solo:
  # 0.4.0 source copy (published on Umbrel before 0.5.2).
  - replaces: [96e77c205182a699]
    description: >-
      Kraskus ZEC Solo runs an easy-to-use Zcash full node and local solo mining
      appliance on your own hardware. The app manages node synchronization, mining
      readiness, worker connections, mining jobs, and block submissions from a single
      interface. Normal users do not need to manage Zebra, RPC, Docker, Linux, JSON, or
      Stratum configuration.
  # 0.5.x (Kraskus Apps V3, pre-NU7) source copy (0.5.1 and 0.5.2 share it).
  - replaces: [1a3474dd9161a35f]
    description: >-
      Zcash by Kraskus runs a self-contained Zcash Mainnet full node (Zebra), the
      Zallet wallet and an Equihash 200,9 solo-mining server on the Kraskus V3
      interface. It shows node synchronization, one truthful mining-readiness state,
      workers, shares and node-confirmed blocks. Miners connect on port 3335; no work
      is issued until the node is synchronized and a payout is configured. The
      built-in wallet is created or restored with a 24-word recovery phrase,
      protected by a wallet password, and can receive, send and act as the mining
      payout; your own transparent t-address can be used instead. Zebra needs about
      320 GiB of free storage for Mainnet; on a smaller host the app reports it and
      does not start syncing. A required 1% developer fee is paid directly from
      successful block coinbases. This is the pre-NU7 release: a follow-up update is
      required for the Zcash NU7 network upgrade.

mysterium-node:
  replaces: [f34455c02271538f]
  tagline: Official MystNodes node with a Kraskus control center
  description: >-
    MystNodes by Kraskus installs and runs the official upstream Mysterium node
    container while preserving the node identity in the app's persistent storage.
    The Kraskus onboarding experience guides new users through a disclosed MystNodes
    referral signup path, while existing MystNodes users can bypass signup and go
    directly to the official Node UI with their own account and API key. A responsive
    control center shows read-only snapshots from the local Mysterium API. The
    underlying node software is provided by Mysterium Network. Participation may
    expose the host's residential IP to third-party traffic; review Mysterium's terms
    and enable only service types appropriate for your location and risk tolerance.
  releaseNotes: >-
    Throttles provider-quality and analytics polling to protect the upstream
    Mysterium quality API from dashboard-driven rate limits, spaces provider
    requests, prevents retry storms, and updates the official node runtime to 1.39.7.
