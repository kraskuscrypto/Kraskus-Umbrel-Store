kraskus-chta-solo:
- replaces:
  - e6d60d2983b5ef87
  description: CHTA Kraskus runs a self-contained CheetahCoin full node and solo-mining appliance. The
    Kraskus interface shows node synchronization, one truthful mining-readiness state, each Stratum port's
    live status, workers, accepted and rejected shares, round progress, and blocks independently confirmed
    by the node. Normal miners connect on port 1926; NMMiner and other very-low-hash devices use port
    1927 with a fixed 0.002 difficulty. Both ports stay closed until the node is synchronized and a valid
    payout is configured. The built-in CheetahCoin wallet can receive, send and act as the mining payout
    once you have downloaded and verified an encrypted backup of the complete wallet file; the same backup
    restores the exact wallet on any CHTA Kraskus install. A required 1% developer fee is paid directly
    from successful block coinbases.
- replaces:
  - 65bec8d9f71b1963
  description: CHTA Kraskus runs a self-contained CheetahCoin full node and solo-mining appliance. The
    Kraskus interface shows node synchronization, one truthful mining-readiness state, workers, accepted
    and rejected shares, and blocks independently confirmed by the node. Normal miners connect on port
    1926; NMMiner and other very-low-hash devices use port 1927 with a fixed 0.002 difficulty. Both ports
    stay closed until the node is synchronized and a valid payout is configured. The built-in CheetahCoin
    wallet can receive, send and act as the mining payout once you have downloaded and verified an encrypted
    backup of the complete wallet file; the same backup restores the exact wallet, and a wallet password
    protects sending, payout changes and Forget. A required 1% developer fee is paid directly from successful
    block coinbases.
- replaces:
  - 33a2548c5d830af8
  description: 'BEFORE UPDATING: move any funds held in the old native wallet to another wallet you control,
    confirm receipt, and securely back up the wallet and recovery information. This release removes native-wallet
    controls. Never purge legacy app data to upgrade. CheetahCoin Core node and solo mining with external
    payout addresses. Home, Mining, Blocks, Blockchain, Kraskus Pool (under development), and Settings
    use the BCH-standard interaction template with CHTA artwork and themes. Normal miners use port 1926;
    very-low-hash devices use port 1927 at difficulty 0.002. Enter and confirm your external CHTA reward
    address, wait for node readiness and explicitly start mining. The fixed 1% developer fee is allocated
    by the existing CKPool coinbase policy. There is no user-facing native wallet, seed or send function.
    Existing wallet data and funds are retained during the protected migration. Core 2.5.0 and both CKPool
    images are unchanged. Existing storage settings are preserved; prune changes are not supported by
    this supervisor.'
kraskus-common-foundry-gpu-miner:
  replaces:
  - f07c9c4c58adeb27
  description: Mines Common Foundry on a supported NVIDIA GPU with the official v1.0.8 miner, unmodified,
    behind the Kraskus interface (CMFD Kraskus). The app downloads and authenticates its own copy of the
    6.4 GB ForgeMatrix model bank, mines to the pool you choose and pays out to the Common Foundry address
    you enter. It holds no wallet and never asks for a passphrase. Mining requires an NVIDIA GPU with
    the NVIDIA driver loaded on the host; the app asks for GPU access when you install it. Works with
    or without the Common Foundry node app. Pool mining only. No developer fee.
kraskus-kaspa-solo:
- replaces:
  - 85a8f599948d440d
  description: Kaspa by Kraskus runs an easy-to-use Kaspa full node and local solo mining appliance on
    your own hardware. The app manages node synchronization, mining readiness, worker connections, a real
    native Kaspa wallet, and confirmed block detection from a single interface. Normal users do not need
    to manage kaspad, RPC, Docker, Linux, JSON, or Stratum configuration. An automatic 1% developer fee
    applies only to successfully mined block rewards after coinbase maturity; miner hashrate is never
    diverted.
- replaces:
  - bd0d7d7556535b2d
  description: 'BEFORE UPDATING: send any crypto held in the app native wallet to another wallet you control,
    confirm receipt, and back up the old wallet and recovery information. This version removes native-wallet
    access from the app. Never delete legacy wallet data or assume uninstalling will preserve it. Kaspa
    by Kraskus turns Umbrel into an easy-to-use Kaspa full node and local solo mining appliance. The app
    manages node synchronization, mining readiness, worker connections, external reward destinations,
    and confirmed block detection from a single interface. Native wallet access is not exposed; the existing
    internal settlement wallet forwards matured rewards after the approved fee and transaction costs.
    Legacy wallet data is preserved. Normal users do not need to manage kaspad, RPC, Docker, Linux, JSON,
    or Stratum configuration. An automatic 1% developer fee applies only to successfully mined block rewards
    after coinbase maturity; miner hashrate is never diverted.'
kraskus-prl-solo:
- replaces:
  - af103adef89ddb0a
  - 923a26d2788e1758
  description: 'Pearl by Kraskus runs a real Pearl v1.4.8 mainnet node, the native Oyster wallet and the
    Kraskus Pearl Stratum gateway on port 1902, with truthful readiness: miners get work only once the
    node is synchronized and a payout is ready. The built-in wallet shows its recovery phrase once and
    confirms it with a word challenge before mining can pay it; a wallet password protects it, and the
    wallet can be restored from the phrase or forgotten. A verified found-blocks ledger and live worker
    and share telemetry are included. Sending from the built-in wallet is not available. A required 1%
    developer fee is paid directly from each successful block coinbase.'
- replaces:
  - a674650d9a0e46ee
  description: 'BEFORE UPDATING: move any funds held in the old native wallet to another wallet you control,
    confirm receipt, and securely back up the wallet and recovery information. This release removes native-wallet
