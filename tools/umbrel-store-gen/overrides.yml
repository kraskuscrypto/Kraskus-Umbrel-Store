mysterium-node:
- replaces:
  - f34455c02271538f
  tagline: Official MystNodes node with a Kraskus control center
  description: MystNodes by Kraskus installs and runs the official upstream Mysterium node container while
    preserving the node identity in the app's persistent storage. The Kraskus onboarding experience guides
    new users through a disclosed MystNodes referral signup path, while existing MystNodes users can bypass
    signup and go directly to the official Node UI with their own account and API key. A responsive control
    center shows read-only snapshots from the local Mysterium API. The underlying node software is provided
    by Mysterium Network. Participation may expose the host's residential IP to third-party traffic; review
    Mysterium's terms and enable only service types appropriate for your location and risk tolerance.
  releaseNotes: Throttles provider-quality and analytics polling to protect the upstream Mysterium quality
    API from dashboard-driven rate limits, spaces provider requests, prevents retry storms, and updates
    the official node runtime to 1.39.7.
- replaces:
  - abdbe9463600d49d
  description: Official Mysterium node with a Kraskus dashboard for provider readiness, earnings, traffic
    and sessions. Version 2.7.0 adds timestamped snapshots, stale-data diagnostics, real provider-series
    charts with accessible point details, matching-period earnings per GB, reliable identity Copy controls,
    independent light/dark mode and three themes. Missing data stays explicit. Mysterium identity, payment
    handling, settlements and withdrawals remain in the official node and MystNodes dashboard; this update
    does not replace them. The upstream node remains pinned to its existing 1.39.7 image. New-user signup
    uses a disclosed Kraskus referral; existing users can open the official Node UI. Participation shares
    your connection with third-party traffic. Review Mysterium terms and choose appropriate services in
    the official Node UI.
  tagline: Mysterium node with provider readiness, earnings and traffic insights
kraskus-bch-solo:
- replaces:
  - 0ac257fb6565db9b
  description: 'Bitcoin Cash by Kraskus runs a pruned Bitcoin Cash Node 29.2.0 (wallet disabled, about
    10 GB of block data) and a solo-mining dashboard. It uses an external CashAddr payout address only:
    the app has no wallet and never asks for a recovery phrase, password or private key. A fixed 1 percent
    developer fee is applied only to successfully mined blocks, as a separate coinbase output; the miner
    receives the remaining 99 percent. Mining capability is enabled on TCP port 1933. Each startup is
    paused; save a valid external BCH payout address, wait for node sync, then use the authenticated Start
    control. Do not forward this miner port to the public internet.'
