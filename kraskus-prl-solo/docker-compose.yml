# 5tratumOS package for Pearl by Kraskus 0.5.1 (Kraskus V3, foundation 1.2.0).
#
# 0.5.1 (miner compatibility): a rebuilt gateway that sends pearl.challenge
# only to silent miners and reads stratum lines up to 4 MiB; pearld/Oyster
# stay the 0.2.1 image, api and ui are rebuilt with the version number only.
#
# 0.5.0 (V3 migration): the shared V3 UI (nginx, plain HTTP 8080, published
# once on the manifest port 33068), the V3 API contract served by the api
# (api/v3_api.py) and the foundation 1.1.2 app-token fallback for platforms
# without the P2 proxy token (stock 5tratumOS, Umbrel). pearld, Oyster and the
# gateway run the unchanged 0.2.1 images; data paths are exactly as 0.2.1.
# The gateway now reads its payout address from wallet/.kraskus/payout-address,
# which the api writes (native wallet once set up, or the owner's external
# address); the wallet's own receive-address record is unchanged.
#
# Published host ports: 1902 (Stratum), 44108 (Pearl P2P) and the UI 33068
# (127.0.0.1 under P2). RPC, the API and the gateway telemetry are internal.

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
    networks:
      - public

  init:
    image: ghcr.io/kraskuscrypto/kraskus-prl-node@sha256:82bde309dd3e842f908f27e0058b9c38b292e40d50230524c1dd6b4704941b49
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /appdata/node /appdata/wallet /appdata/mining /appdata/logs/node /appdata/logs/wallet /appdata/secrets /appdata/config/app-token
        chmod 700 /appdata/config/app-token
        if [ ! -s /appdata/secrets/rpc-user ]; then
          printf 'kraskus-prl-%s\n' "$(openssl rand -hex 8)" > /appdata/secrets/rpc-user
        fi
        if [ ! -s /appdata/secrets/rpc-password ]; then
          openssl rand -hex 32 > /appdata/secrets/rpc-password
        fi
        chmod 700 /appdata/secrets
        chmod 600 /appdata/secrets/rpc-user /appdata/secrets/rpc-password
    volumes:
      - ${APP_DATA_DIR}:/appdata
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  pearld:
    image: ghcr.io/kraskuscrypto/kraskus-prl-node@sha256:82bde309dd3e842f908f27e0058b9c38b292e40d50230524c1dd6b4704941b49
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/node:/data
      - ${APP_DATA_DIR}/logs/node:/logs
      - ${APP_DATA_DIR}/secrets/rpc-user:/run/secrets/prl_rpc_user:ro
      - ${APP_DATA_DIR}/secrets/rpc-password:/run/secrets/prl_rpc_password:ro
    ports:
      - "44108:44108/tcp"
    networks:
      - public
      - internal
    healthcheck:
      # Liveness only (RPC answers). Sync state is reported by the API's
      # readiness model, never by container health. getblockcount is
      # lock-free; getblockchaininfo waits on block validation (observed up
      # to ~30 s) and made a healthy node flap unhealthy (0.2.1).
      test:
        - CMD-SHELL
        - prlctl --notls --rpcserver=127.0.0.1:44107 --rpcuser=$$(cat /run/secrets/prl_rpc_user) --rpcpass=$$(cat /run/secrets/prl_rpc_password) getblockcount >/dev/null 2>&1
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  oyster:
    image: ghcr.io/kraskuscrypto/kraskus-prl-node@sha256:82bde309dd3e842f908f27e0058b9c38b292e40d50230524c1dd6b4704941b49
    restart: unless-stopped
    stop_grace_period: 30s
    entrypoint: ["/usr/local/bin/oyster-entrypoint.sh"]
    depends_on:
      init:
        condition: service_completed_successfully
      pearld:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet
      - ${APP_DATA_DIR}/logs/wallet:/logs
      - ${APP_DATA_DIR}/secrets/rpc-user:/run/secrets/prl_rpc_user:ro
      - ${APP_DATA_DIR}/secrets/rpc-password:/run/secrets/prl_rpc_password:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  gateway:
    image: ghcr.io/kraskuscrypto/kraskus-prl-solo-gateway:0.5.1@sha256:52253e64871319ffab2539c9a1a1a659f7b891166bd869a0f8c7a943cd39a6cb
    restart: unless-stopped
    # No wallet-wait shell loop any more: without a confirmed customer payout
    # address the gateway itself listens in "wallet_wait" mode and rejects
    # miners explicitly; it restarts into mining mode when the API publishes
    # the address, and never falls back to any other address.
    environment:
      PEARLD_RPC_URL: "http://pearld:44107/"
      KRASKUS_PRL_RPC_USER_FILE: "/run/secrets/prl_rpc_user"
      KRASKUS_PRL_RPC_PASSWORD_FILE: "/run/secrets/prl_rpc_password"
      # 0.5.0: the payout destination the api publishes (native or external).
      KRASKUS_PRL_MINING_ADDRESS_FILE: "/wallet/.kraskus/payout-address"
      KRASKUS_PRL_BLOCK_LEDGER: "/mining/blocks.jsonl"
      KRASKUS_PRL_STRATUM_HOST: "0.0.0.0"
      KRASKUS_PRL_STRATUM_PORT: "1902"
      KRASKUS_PRL_TELEMETRY_HOST: "0.0.0.0"
      KRASKUS_PRL_TELEMETRY_PORT: "1903"
    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet:ro
      - ${APP_DATA_DIR}/mining:/mining
      - ${APP_DATA_DIR}/secrets/rpc-user:/run/secrets/prl_rpc_user:ro
      - ${APP_DATA_DIR}/secrets/rpc-password:/run/secrets/prl_rpc_password:ro
    depends_on:
      init:
        condition: service_completed_successfully
      pearld:
        condition: service_healthy
    ports:
      - "1902:1902/tcp"
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1903/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/kraskuscrypto/kraskus-prl-solo-api:0.5.1@sha256:c3801848e0eb730bfe24bc3b9d44af47769934c2dc85aa23509c88e697462c61
    restart: unless-stopped
    environment:
      KRASKUS_API_HOST: "0.0.0.0"
      KRASKUS_API_PORT: "18441"
      KRASKUS_PRL_RPC_URL: "http://pearld:44107/"
      KRASKUS_PRL_WALLET_RPC_URL: "http://oyster:44207/"
      KRASKUS_PRL_GATEWAY_TELEMETRY_URL: "http://gateway:1903"
      KRASKUS_PRL_BLOCK_LEDGER: "/mining/blocks.jsonl"
      KRASKUS_PRL_RPC_USER_FILE: "/run/secrets/prl_rpc_user"
      KRASKUS_PRL_RPC_PASSWORD_FILE: "/run/secrets/prl_rpc_password"
      KRASKUS_PRL_WALLET_USER_FILE: "/run/secrets/prl_rpc_user"
      KRASKUS_PRL_WALLET_PASSWORD_FILE: "/run/secrets/prl_rpc_password"
      KRASKUS_OYSTER_BIN: "/usr/local/bin/oyster"
      KRASKUS_OYSTER_APPDATA: "/wallet"
      KRASKUS_PRL_SHARE_DIFFICULTY: "50000"
      # Foundation 1.1.2 app-token fallback: service_init creates it once
      # when no platform token is mounted (stock 5tratumOS, Umbrel).
      KRASKUS_APP_TOKEN_FILE: "/data/config/app-token/token"
    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet
      - ${APP_DATA_DIR}/config:/data/config
      - ${APP_DATA_DIR}/mining:/mining:ro
      - ${APP_DATA_DIR}/secrets/rpc-user:/run/secrets/prl_rpc_user:ro
      - ${APP_DATA_DIR}/secrets/rpc-password:/run/secrets/prl_rpc_password:ro
    depends_on:
      init:
        condition: service_completed_successfully
      pearld:
        condition: service_healthy
      oyster:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18441/livez', timeout=2).read()"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-prl-solo-ui:0.5.1@sha256:f2cbbbf49f9e14eef26fcca7a3124fd89e135ce531105b918001ee353dfd01c8
    restart: unless-stopped
    environment:
      ADAPTER_HOST: api
    depends_on:
      api:
        condition: service_healthy
    # The contract's ui_port (8080, plain HTTP, the only listener), published
    # once on the manifest port. 5tratumOS P2 renders it on 127.0.0.1 only.
    # Foundation 1.1.2: the app-token fallback directory, read-only;
    # kraskus-app-token.sh supplies that token only to /api/ requests that
    # carry no token header (stock 5tratumOS, Umbrel).
    volumes:
      - ${APP_DATA_DIR}/config/app-token:/run/kraskus-app-token:ro
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - public
      - internal
    security_opt:
      - no-new-privileges:true

# Read only by 5tratumOS with the P2 secure proxy: the ui service's port 8080
# is published on 127.0.0.1 only and the api gets the per-app token mounted.
x-5tratumos-secure-proxy:
  version: 1
  ui_service: ui
  ui_port: 8080
  token_services: [api]

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
