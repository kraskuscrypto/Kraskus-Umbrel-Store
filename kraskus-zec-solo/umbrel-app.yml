description: 'Zcash by Kraskus runs a self-contained Zcash Mainnet full node (Zebra), the Zallet wallet and an Equihash 200,9 solo-mining server on the Kraskus V3 interface. It shows node synchronization, one truthful mining-readiness state, workers, shares and node-confirmed blocks. Miners connect on port 3335; no work is issued until the node is synchronized and a payout is configured. The built-in wallet is created or restored with a 24-word recovery phrase, protected by a wallet password, and can receive, send and act as the mining payout; your own transparent t-address can be used instead. Zebra needs about 320 GiB of free storage for Mainnet; on a smaller host the app reports it and does not start syncing. A required 1% developer fee is paid directly from successful block coinbases. This is the pre-NU7 release: a follow-up update is required for the Zcash NU7 network upgrade.'
