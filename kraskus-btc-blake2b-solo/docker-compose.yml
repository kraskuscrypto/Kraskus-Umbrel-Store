# BTC2b by Kraskus 0.2.5 -- 5tratumOS Store recipe.
# Images are pinned to immutable digests built by build.sh from runtime
# source 9e7fca7 (knots, ui: carried forward from 0.2.3) and the 0.2.5
# source b6e0eac (datum, adapter); release-manifest.json records the same
# digests.
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
    networks:
      - b2b_api

  runtime-init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /blockchain /runtime /secrets /events/submitblocks
        chown 1000:999 /blockchain
        chmod 0750 /blockchain
        chown 0:2000 /runtime /secrets /events /events/submitblocks
        chmod 0770 /runtime
        chmod 0750 /secrets
        # setgid: DATUM writes block evidence, the adapter (group 2000) reads it
        chmod 2770 /events /events/submitblocks
        if [ ! -s /runtime/prune_target_mib ]; then
          printf '102400\n' > /runtime/prune_target_mib
        fi
        chown 0:2000 /runtime/prune_target_mib
        chmod 0640 /runtime/prune_target_mib
        if [ ! -s /secrets/rpc-password ]; then
          umask 027
          tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48 > /secrets/rpc-password
          printf '\n' >> /secrets/rpc-password
        fi
        if [ ! -s /secrets/datum-admin-password ]; then
          umask 027
          tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48 > /secrets/datum-admin-password
          printf '\n' >> /secrets/datum-admin-password
        fi
        chown 0:2000 /secrets/rpc-password /secrets/datum-admin-password
        chmod 0640 /secrets/rpc-password /secrets/datum-admin-password
        echo "BTC2B_RUNTIME_INIT=PASS"
    volumes:
      - ${APP_DATA_DIR}/blockchain:/blockchain
      - ${APP_DATA_DIR}/runtime:/runtime
      - ${APP_DATA_DIR}/secrets:/secrets
      - ${APP_DATA_DIR}/events:/events
    network_mode: "none"
    security_opt:
      - no-new-privileges:true

  knots:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-btc-blake2b-knots:0.2.3@sha256:30cd9a906255e79a0a8b9627dfd806c9d3c2088adeb633761d1f2751f310ca4e
    pull_policy: missing
    restart: unless-stopped
    # Never SIGKILL Knots before it has flushed its UTXO cache (a kill during
    # shutdown corrupted the chainstate in 0.2.0 QA); Tor control is off so
    # shutdown normally takes seconds, this is the safety margin.
    stop_grace_period: 10m
    group_add:
      - "2000"
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export KNOTS_RPC_USER=kraskus
        export KNOTS_RPC_PASSWORD="$$(cat /secrets/rpc-password)"
        exec /usr/local/bin/knots-entrypoint
    volumes:
      - ${APP_DATA_DIR}/blockchain:/data
      - ${APP_DATA_DIR}/runtime:/runtime:ro
      - ${APP_DATA_DIR}/secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL","bitcoin-cli -conf=/tmp/knots-config/bitcoin.conf -datadir=/data getblockchaininfo >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 8
      # a large pruned chain can take minutes to load (or replay after an
      # unclean stop); failures inside this window never mark it unhealthy
      start_period: 10m
    security_opt:
      - no-new-privileges:true
    networks:
      - b2b_public
      - b2b_private

  datum:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-btc-blake2b-datum:0.2.5@sha256:c1d7ab3a73caa8854bba4a2127fa273174645fd6da939456b43699143fc5ba39
    pull_policy: missing
    restart: unless-stopped
    group_add:
      - "2000"
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      knots:
        condition: service_healthy
    environment:
      BLAKE2B_PAYOUT_FILE: /runtime/mining_payout_address
      BLAKE2B_VARDIFF_MIN_FILE: /runtime/vardiff_min
      KRASKUS_STRATUM_PORT: "1923"
      KRASKUS_EVENTS_DIR: /events
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export KNOTS_RPC_USER=kraskus
        export KNOTS_RPC_PASSWORD="$$(cat /secrets/rpc-password)"
        export DATUM_ADMIN_PASSWORD="$$(cat /secrets/datum-admin-password)"
        exec /usr/local/bin/datum-entrypoint
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime:ro
      - ${APP_DATA_DIR}/secrets:/secrets:ro
      - ${APP_DATA_DIR}/events:/events
    ports:
      - "1923:1923/tcp"
    healthcheck:
      # Healthy while deliberately waiting for the reward wallet (Stratum
      # closed), or once the gateway API answers. Readiness is decided by
      # the adapter, never by this check.
      test: ["CMD-SHELL","test -f /tmp/datum-waiting || curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7152/ | grep -Eq '^(200|401)$'"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - b2b_private
      - b2b_api

  adapter:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-btc-blake2b-adapter:0.2.5@sha256:9500646307382d24a2bbdce4b20d979b5041f2c763130862363c52deb949f289
    pull_policy: missing
    restart: unless-stopped
    group_add:
      - "2000"
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      knots:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export KRASKUS_B2B_RPC_PASSWORD="$$(cat /secrets/rpc-password)"
        exec python /app/adapter.py
    environment:
      KRASKUS_B2B_RPC_URL: http://knots:8332
      KRASKUS_B2B_RPC_USER: kraskus
      KRASKUS_B2B_DATUM_HOST: datum
      KRASKUS_B2B_DATUM_API_PORT: "7152"
      KRASKUS_B2B_STRATUM_PORT: "1923"
      KRASKUS_B2B_RUNTIME_DIR: /runtime
      KRASKUS_B2B_BLOCK_EVENTS_FILE: /events/block-events.jsonl
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime
      - ${APP_DATA_DIR}/secrets:/secrets:ro
      - ${APP_DATA_DIR}/events:/events:ro
    healthcheck:
      test: ["CMD-SHELL","python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:18430/health',timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - b2b_private
      - b2b_api

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-btc-blake2b-ui:0.2.3@sha256:7a9dc3d0c31e016e23bcfb58caf91ae684da9d848332cdd66a2d4ec86196eddd
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - b2b_api

networks:
  b2b_public:
    driver: bridge
  b2b_private:
    driver: bridge
    internal: true
  b2b_api:
    driver: bridge
