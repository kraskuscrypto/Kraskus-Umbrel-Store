# DigiByte Solo by Kraskus 0.2.0 -- 5tratumOS Store recipe (Kraskus V3,
# foundation 1.11.0).
#
# 0.2.0 (V3 migration, owner decisions 2026-10-13): the shared V3 UI (nginx,
# plain HTTP 8080, published once on the manifest port 33071), the V3 API
# contract served by the adapter (adapter/v3_api.py) behind the foundation
# route policy, and the foundation 1.1.2 app-token fallback for platforms
# without the P2 proxy token (stock 5tratumOS, Umbrel). DigiByte Core 9.26.7,
# the three Stratum lanes, ports, networks and data paths are exactly as 0.1.3.
#
#   init             adapter image, one-shot as root: persistent layout,
#                    per-component RPC credentials + rpcwhitelist, defaults
#   node             DigiByte Core (built from source at the pinned commit)
#                    P2P 12024 published; RPC 14022 / ZMQ 28332 internal only
#   stratum-sha256d  Kraskus Stratum lane, SHA-256   host 1928
#   stratum-scrypt   Kraskus Stratum lane, Scrypt    host 1929
#   stratum-skein    Kraskus Stratum lane, Skein     host 1930
#   adapter          readiness, wallet, mining gate, ledger, V3 API (internal);
#                    token service of the P2 secure proxy: every state change
#                    and every wallet-data read needs the platform (or app)
#                    token; the wallet password guards backups, Forget and send
#   ui               shared Kraskus V3 web UI (nginx, plain HTTP 8080)
#
# 1931 (Qubit) and 1932 (Odo) are reserved for DigiByte and not published.
#
# Persistent data (layout v1, independent of the DigiByte Core version, see
# apps/dgb-solo/docs/node-upgrade.md): node/ (blocks, chainstate, indexes,
# wallets), runtime/ (adapter state, node settings, 0.2.0: app-token/ and
# uploads/), stratum/<algo>/ (lane state), secrets/<component>/ (each
# container mounts only its own).
#
# Networks: dgb_public (node P2P, published Stratum ports, UI port) and
# dgb_private (internal: RPC, ZMQ, lane telemetry, adapter, UI). The UI is on
# both: Docker publishes no host port for a container that is only on
# internal networks. These names are
# permanent: the 5tratumOS CLI never removes a network a later compose file
# drops, so renaming one would leak an address-pool slot on every update.
#
# Image references are pinned to immutable digests at publication
# (release-manifest.json records the same digests). 0.2.0 reuses the released
# 0.1.3 node (DigiByte Core 9.26.7) and stratum images byte for byte: their
# source is unchanged, so consensus, PoW, lanes and the developer fee are the
# exact 0.1.3 binaries. Only the adapter and UI images are new.
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
    networks:
      - dgb_private

  init:
    image: ghcr.io/kraskuscrypto/kraskus-dgb-solo-adapter:0.2.0@sha256:6df62d6af8cadd79d32c2a9ca1bd293ffca5977276c829da183db163233e2e97
    pull_policy: missing
    restart: "no"
    user: "0:0"
    command: ["python", "/app/dgb_init.py"]
    environment:
      DGB_DATA_ROOT: /data-root
    volumes:
      - ${APP_DATA_DIR}/node:/data-root/node
      - ${APP_DATA_DIR}/runtime:/data-root/runtime
      - ${APP_DATA_DIR}/stratum:/data-root/stratum
      - ${APP_DATA_DIR}/secrets:/data-root/secrets
    network_mode: "none"
    security_opt:
      - no-new-privileges:true

  node:
    image: ghcr.io/kraskuscrypto/kraskus-dgb-solo-node:0.1.3@sha256:32efdc8ecd8c5b3866539cda24efabd0ed3cd209dc41c5d06e5fb00bc71f8a33
    pull_policy: missing
    restart: unless-stopped
    # Never SIGKILL digibyted while it flushes its UTXO cache. The 5tratumOS
    # CLI honours this grace on update, down and uninstall; dgb-safe-stop.sh
    # (package README) confirms the clean exit before those steps.
    stop_grace_period: 10m
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      DGB_CHAIN: main
    volumes:
      - ${APP_DATA_DIR}/node:/data
      - ${APP_DATA_DIR}/runtime/node:/runtime/node:ro
      - ${APP_DATA_DIR}/secrets/node:/secrets:ro
    ports:
      - "12024:12024/tcp"
    healthcheck:
      # Healthy while RPC answers or reports "warming up" (-28): loading or
      # verifying a large preserved chain is normal, never unhealthy.
      test: ["CMD", "/usr/local/bin/dgb-healthcheck"]
      interval: 30s
      timeout: 25s
      retries: 10
      start_period: 15m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - dgb_public
      - dgb_private

  stratum-sha256d:
    image: ghcr.io/kraskuscrypto/kraskus-dgb-solo-stratum:0.1.3@sha256:37c823fe16e1e603707b9b5e19602b345004aac8b4bf9d5ce5e449aedc9cba40
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      node:
        condition: service_started
    environment:
      DGB_ALGO: sha256d
      DGB_CHAIN: main
      DGB_RPC_URL: http://node:14022
      DGB_RPC_USER: stratum_sha256d
      DGB_RPC_PASSWORD_FILE: /secrets/rpc-password
      DGB_GATE_FILE: /runtime/mining-gate.json
      DGB_STATE_DIR: /state
    volumes:
      - ${APP_DATA_DIR}/stratum/sha256d:/state
      - ${APP_DATA_DIR}/runtime:/runtime:ro
      - ${APP_DATA_DIR}/secrets/stratum-sha256d:/secrets:ro
    ports:
      - "1928:1928/tcp"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - dgb_public
      - dgb_private

  stratum-scrypt:
    image: ghcr.io/kraskuscrypto/kraskus-dgb-solo-stratum:0.1.3@sha256:37c823fe16e1e603707b9b5e19602b345004aac8b4bf9d5ce5e449aedc9cba40
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      node:
        condition: service_started
    environment:
      DGB_ALGO: scrypt
      DGB_CHAIN: main
      DGB_RPC_URL: http://node:14022
      DGB_RPC_USER: stratum_scrypt
      DGB_RPC_PASSWORD_FILE: /secrets/rpc-password
      DGB_GATE_FILE: /runtime/mining-gate.json
      DGB_STATE_DIR: /state
    volumes:
      - ${APP_DATA_DIR}/stratum/scrypt:/state
      - ${APP_DATA_DIR}/runtime:/runtime:ro
      - ${APP_DATA_DIR}/secrets/stratum-scrypt:/secrets:ro
    ports:
      - "1929:1929/tcp"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - dgb_public
      - dgb_private

  stratum-skein:
    image: ghcr.io/kraskuscrypto/kraskus-dgb-solo-stratum:0.1.3@sha256:37c823fe16e1e603707b9b5e19602b345004aac8b4bf9d5ce5e449aedc9cba40
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      node:
        condition: service_started
    environment:
      DGB_ALGO: skein
      DGB_CHAIN: main
      DGB_RPC_URL: http://node:14022
      DGB_RPC_USER: stratum_skein
      DGB_RPC_PASSWORD_FILE: /secrets/rpc-password
      DGB_GATE_FILE: /runtime/mining-gate.json
      DGB_STATE_DIR: /state
    volumes:
      - ${APP_DATA_DIR}/stratum/skein:/state
      - ${APP_DATA_DIR}/runtime:/runtime:ro
      - ${APP_DATA_DIR}/secrets/stratum-skein:/secrets:ro
    ports:
      - "1930:1930/tcp"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - dgb_public
      - dgb_private

  adapter:
    image: ghcr.io/kraskuscrypto/kraskus-dgb-solo-adapter:0.2.0@sha256:6df62d6af8cadd79d32c2a9ca1bd293ffca5977276c829da183db163233e2e97
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 20s
    # Foundation 1.1.2 start step, as the image user 65532 (never root):
    # without a platform token it creates the app token once (0400, in the
    # 0700 runtime/app-token directory the init step created); with the P2
    # token mounted it removes it. Then the adapter.
    command: ["python", "-m", "kraskus_foundation.service_init", "--uid", "65532", "--gid", "2000", "--",
              "python", "/app/adapter.py"]
    depends_on:
      init:
        condition: service_completed_successfully
      node:
        condition: service_started
    environment:
      DGB_CHAIN: main
      KRASKUS_DGB_RPC_URL: http://node:14022
      KRASKUS_DGB_RPC_USER: adapter
      KRASKUS_DGB_RPC_PASSWORD_FILE: /secrets/rpc-password
      KRASKUS_DGB_RUNTIME_DIR: /runtime
      KRASKUS_DGB_STRATUM_DIR: /stratum
      # Foundation 1.1.2 app-token fallback (V3): used only while no P2
      # platform token is mounted. Never logged.
      KRASKUS_APP_TOKEN_FILE: /runtime/app-token/token
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime
      - ${APP_DATA_DIR}/stratum:/stratum:ro
      - ${APP_DATA_DIR}/secrets/adapter:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18460/livez', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - dgb_private

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-dgb-solo-ui:0.2.0@sha256:f6ae932715dffa16703d23201264a325001856f06c2687380f27aac46f477da8
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      adapter:
        condition: service_healthy
    environment:
      ADAPTER_HOST: adapter
    # The contract's ui_port (8080, plain HTTP, the only listener), published
    # once on the manifest port. 5tratumOS P2 renders it on 127.0.0.1 only
    # and reaches it through its authenticated HTTPS dashboard route, adding
    # the per-app token; nginx relays the portal's header on /api/ only.
    # Foundation 1.1.2: the app-token fallback directory, read-only;
    # kraskus-app-token.sh supplies that token only to /api/ requests that
    # carry no token header (stock 5tratumOS, Umbrel). Under P2 the adapter
    # removes the app token, so the UI only relays the platform's header.
    volumes:
      - ${APP_DATA_DIR}/runtime/app-token:/run/kraskus-app-token:ro
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/index.html"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - dgb_private
      - dgb_public

networks:
  dgb_public:
    driver: bridge
  dgb_private:
    driver: bridge
    internal: true

# Read only by 5tratumOS with the P2 secure proxy: the ui service's port 8080
# is published on 127.0.0.1 only and the token service gets the per-app token
# mounted read-only at /run/5tratumos.
x-5tratumos-secure-proxy:
  version: 1
  ui_service: ui
  ui_port: 8080
  token_services: [adapter]
