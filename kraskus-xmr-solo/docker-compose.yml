# 5tratumOS package for Monero by Kraskus 0.2.0 (Kraskus V3, foundation 1.15.0).
#
# 0.2.0 (V3 migration, owner decisions 2026-10-13/14): the shared V3 UI (nginx,
# plain HTTP 8080, published once on the manifest port 33065), the V3 API
# contract served by the adapter (route policy: the 5tratumOS P2 proxy token,
# or the foundation app-token fallback on platforms without it, plus the
# wallet password for wallet actions), and wallet-api as an internal-only
# wallet service. Service names, data paths and the monerod image are exactly
# as 0.1.22 (an update leaves no orphan container and keeps the chain, both
# wallets, the spend password, the pending backup, the payout address, share
# and per-worker difficulty, share stats, block/send logs and the
# integrity-anchored developer-fee ledger).
#
# 0.2.0 images carry their third-party licences (monerod: Monero BSD-3-Clause;
# gateway: XMRig Proxy GPL-3.0 + source directions) under /usr/share/licenses.
#
# Published host ports: 18080 (Monero P2P), 1921 (Stratum) and the UI 33065.
# monerod RPC, wallet-rpcs, wallet-api, the adapter and the gateway telemetry
# are internal.

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
    networks:
      - xmr_api

  wallet-init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /blockchain /wallets /runtime /secrets /runtime/security /runtime/app-token
        chown 1000:1000 /blockchain /wallets /runtime /secrets /runtime/security /runtime/app-token
        chmod 700 /secrets /runtime/security /runtime/app-token
        if [ ! -s /wallets/.view-password ]; then
          umask 077
          tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48 > /wallets/.view-password
          printf '\n' >> /wallets/.view-password
          chown 1000:1000 /wallets/.view-password
          chmod 600 /wallets/.view-password
        fi
    volumes:
      - ${APP_DATA_DIR}/blockchain:/blockchain
      - ${APP_DATA_DIR}/wallets:/wallets
      - ${APP_DATA_DIR}/runtime:/runtime
      - ${APP_DATA_DIR}/secrets:/secrets
    security_opt:
      - no-new-privileges:true

  monerod:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-monerod:0.2.0@sha256:cb8799ae1d042ed506b386939e308239423971f3d2581db84120335de7c06ec1
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      wallet-init:
        condition: service_completed_successfully
    command:
      - --data-dir=/data
      - --non-interactive
      - --prune-blockchain
      - --p2p-bind-ip=0.0.0.0
      - --p2p-bind-port=18080
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18081
      - --confirm-external-bind
      - --no-igd
      - --log-level=0
    ports:
      - "18080:18080/tcp"
    volumes:
      - ${APP_DATA_DIR}/blockchain:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":"0","method":"get_info"}'
          http://127.0.0.1:18081/json_rpc >/dev/null
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 2m
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_public
      - xmr_private
      - xmr_wallet

  wallet-view-rpc:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-monerod:0.2.0@sha256:cb8799ae1d042ed506b386939e308239423971f3d2581db84120335de7c06ec1
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/monero-wallet-rpc"]
    command:
      - --wallet-dir=/wallets
      - --daemon-address=http://monerod:18081
      - --trusted-daemon
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18083
      - --confirm-external-bind
      - --disable-rpc-login
      - --log-level=0
    volumes:
      - ${APP_DATA_DIR}/wallets:/wallets
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      monerod:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_wallet

  wallet-spend-rpc:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-monerod:0.2.0@sha256:cb8799ae1d042ed506b386939e308239423971f3d2581db84120335de7c06ec1
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/monero-wallet-rpc"]
    command:
      - --wallet-dir=/wallets
      - --daemon-address=http://monerod:18081
      - --trusted-daemon
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18084
      - --confirm-external-bind
      - --disable-rpc-login
      - --log-level=0
    volumes:
      - ${APP_DATA_DIR}/wallets:/wallets
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      monerod:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_wallet

  gateway:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-miner-gateway:0.2.0@sha256:951f679fbb6e75511204ec4ac54deb92235aeebd3099835a051b8191a54928a3
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      monerod:
        condition: service_healthy
    environment:
      KRASKUS_XMR_STRATUM_HOST: "0.0.0.0"
      KRASKUS_XMR_STRATUM_PORT: "1921"
      KRASKUS_XMR_TELEMETRY_PORT: "1924"
      KRASKUS_XMR_SHARE_DIFF: "1000"
      KRASKUS_XMR_FALLBACK_PAYOUT_ADDRESS: ""
      KRASKUS_XMR_MONEROD_BASE: "http://monerod:18081"
      KRASKUS_XMR_SUBMISSION_LOG: "/runtime/block-submissions.jsonl"
      KRASKUS_XMR_EVENT_LOG: "/runtime/events.jsonl"
      # 0.2.0: the only payout input, written by wallet-api from its armed payout setting.
      KRASKUS_XMR_PAYOUT_ADDRESS_FILE: "/runtime/payout-address"
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime
    ports:
      - "1921:1921/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1924/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_public
      - xmr_private
      - xmr_core

  wallet-api:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-wallet-api:0.2.0@sha256:f8cbbcaedcd66f0e19e6f545f3f9acb2cb179a2f17ee926299f5e13532ead65c
    restart: unless-stopped
    user: "1000:1000"
    environment:
      KRASKUS_XMR_WALLET_API_HOST: "0.0.0.0"
      KRASKUS_XMR_WALLET_API_PORT: "18420"
      KRASKUS_XMR_VIEW_RPC: "http://wallet-view-rpc:18083/json_rpc"
      KRASKUS_XMR_SPEND_RPC: "http://wallet-spend-rpc:18084/json_rpc"
      KRASKUS_XMR_VIEW_WALLET: "kraskus-xmr-solo-view"
      KRASKUS_XMR_VIEW_PASSWORD_FILE: "/wallets/.view-password"
      KRASKUS_XMR_SPEND_WALLET: "kraskus-xmr-solo"
      KRASKUS_XMR_SPEND_PASSWORD_FILE: "/run/kraskus-secrets/spend-wallet-password"
      KRASKUS_XMR_MONEROD_RPC: "http://monerod:18081/json_rpc"
      KRASKUS_XMR_WALLET_SEND_LOG: "/runtime/wallet-sends.jsonl"
      KRASKUS_XMR_EVENT_LOG: "/runtime/events.jsonl"
      KRASKUS_XMR_WALLET_CONFIG: "/runtime/wallet-config.json"
    volumes:
      - ${APP_DATA_DIR}/wallets:/wallets
      - ${APP_DATA_DIR}/runtime:/runtime
      - ${APP_DATA_DIR}/secrets:/run/kraskus-secrets
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      wallet-view-rpc:
        condition: service_started
      wallet-spend-rpc:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18420/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_wallet
      - xmr_core

  adapter:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-adapter:0.2.0@sha256:6108ffc166f00d24f27127bec7b710f01d3a0961d6f98bc6ddbb3f9a495f7582
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      monerod:
        condition: service_started
    environment:
      KRASKUS_XMR_ADAPTER_HOST: "0.0.0.0"
      KRASKUS_XMR_ADAPTER_PORT: "18410"
      KRASKUS_XMR_RPC_URL: "http://monerod:18081/json_rpc"
      KRASKUS_XMR_RPC_TIMEOUT_SECONDS: "30"
      KRASKUS_XMR_STATUS_POLL_SECONDS: "5"
      KRASKUS_XMR_RUNTIME: "/runtime"
      KRASKUS_XMR_WALLET_API_URL: "http://wallet-api:18420"
      KRASKUS_XMR_GATEWAY_URL: "http://gateway:1924"
      KRASKUS_APP_TOKEN_FILE: "/runtime/app-token/token"
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18410/livez', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - xmr_api
      - xmr_core
      - xmr_private

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-ui:0.2.0@sha256:b097d0d223debed62fc4cb48b6e4ae533a8588b4b1c1ed452c73af11ef50de48
    restart: unless-stopped
    depends_on:
      adapter:
        condition: service_healthy
    environment:
      ADAPTER_HOST: adapter
    volumes:
      - ${APP_DATA_DIR}/runtime/app-token:/run/kraskus-app-token:ro
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/index.html"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_api

networks:
  xmr_public:
    driver: bridge
  xmr_private:
    driver: bridge
    internal: true
  xmr_api:
    driver: bridge
  xmr_wallet:
    driver: bridge
    internal: true
  xmr_core:
    driver: bridge
    internal: true

x-5tratumos-secure-proxy:
  version: 1
  ui_service: ui
  ui_port: 8080
  token_services: [adapter]
