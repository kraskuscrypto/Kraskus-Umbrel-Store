services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080

  wallet-init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /blockchain /wallets /runtime /secrets
        chown 1000:1000 /blockchain /wallets /runtime /secrets
        chmod 700 /secrets
        if [ ! -s /wallets/.view-password ]; then
          umask 077
          tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48 > /wallets/.view-password
          printf '\n' >> /wallets/.view-password
          chown 1000:1000 /wallets/.view-password
          chmod 600 /wallets/.view-password
        fi
    volumes:
      - ${APP_DATA_DIR}/blockchain:/blockchain
      - ${APP_DATA_DIR}/wallets:/wallets
      - ${APP_DATA_DIR}/runtime:/runtime
      - ${APP_DATA_DIR}/secrets:/secrets
    security_opt:
      - no-new-privileges:true

  monerod:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-monerod@sha256:1d90d99963de534c6d566953985fc02dd527ef14c588ec2e7028e5ffcaf907da
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      wallet-init:
        condition: service_completed_successfully
    command:
      - --data-dir=/data
      - --non-interactive
      - --prune-blockchain
      - --p2p-bind-ip=0.0.0.0
      - --p2p-bind-port=18080
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18081
      - --confirm-external-bind
      - --no-igd
      - --log-level=0
    ports:
      - "18080:18080/tcp"
    volumes:
      - ${APP_DATA_DIR}/blockchain:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":"0","method":"get_info"}'
          http://127.0.0.1:18081/json_rpc >/dev/null
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 2m
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_public
      - xmr_private
      - xmr_wallet

  wallet-view-rpc:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-monerod@sha256:1d90d99963de534c6d566953985fc02dd527ef14c588ec2e7028e5ffcaf907da
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/monero-wallet-rpc"]
    command:
      - --wallet-dir=/wallets
      - --daemon-address=http://monerod:18081
      - --trusted-daemon
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18083
      - --confirm-external-bind
      - --disable-rpc-login
      - --log-level=0
    volumes:
      - ${APP_DATA_DIR}/wallets:/wallets
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      monerod:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_wallet

  wallet-spend-rpc:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-monerod@sha256:1d90d99963de534c6d566953985fc02dd527ef14c588ec2e7028e5ffcaf907da
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/monero-wallet-rpc"]
    command:
      - --wallet-dir=/wallets
      - --daemon-address=http://monerod:18081
      - --trusted-daemon
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18084
      - --confirm-external-bind
      - --disable-rpc-login
      - --log-level=0
    volumes:
      - ${APP_DATA_DIR}/wallets:/wallets
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      monerod:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_wallet

  adapter:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-adapter@sha256:b8b1ae475bc62f0a9f659d41529ddb339350cf21df6d7732867c330e92ec90bb
    restart: unless-stopped
    depends_on:
      monerod:
        condition: service_healthy
    environment:
      KRASKUS_XMR_ADAPTER_HOST: "0.0.0.0"
      KRASKUS_XMR_ADAPTER_PORT: "18410"
      KRASKUS_XMR_RPC_URL: "http://monerod:18081/json_rpc"
      KRASKUS_XMR_RPC_TIMEOUT_SECONDS: "30"
      KRASKUS_XMR_STATUS_POLL_SECONDS: "5"
      KRASKUS_XMR_STATUS_CACHE: "/runtime/node-status-cache.json"
      KRASKUS_XMR_DIFFICULTY_LOG: "/runtime/network-difficulty.jsonl"
      KRASKUS_XMR_DIFFICULTY_SAMPLE_SECONDS: "60"
      KRASKUS_XMR_DIFFICULTY_MAX_ROWS: "1440"
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18410/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_private
      - xmr_api

  gateway:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-miner-gateway@sha256:f595e7e064864b374965e19420244ee5c6ed8c5ffc7efab0c60f8d59b2b68054
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      monerod:
        condition: service_healthy
    environment:
      KRASKUS_XMR_STRATUM_HOST: "0.0.0.0"
      KRASKUS_XMR_STRATUM_PORT: "1921"
      KRASKUS_XMR_TELEMETRY_PORT: "1924"
      KRASKUS_XMR_SHARE_DIFF: "1000"
      KRASKUS_XMR_FALLBACK_PAYOUT_ADDRESS: ""
      KRASKUS_XMR_MONEROD_BASE: "http://monerod:18081"
      KRASKUS_XMR_SUBMISSION_LOG: "/runtime/block-submissions.jsonl"
      KRASKUS_XMR_EVENT_LOG: "/runtime/events.jsonl"
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime
    ports:
      - "1921:1921/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1924/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_private
      - xmr_api

  wallet-api:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-wallet-api@sha256:7dfd6b0ab5029c53165b95789e9a3c994a59322f57330b0c02e2c6fe84380a57
    restart: unless-stopped
    user: "1000:1000"
    environment:
      KRASKUS_XMR_WALLET_API_HOST: "0.0.0.0"
      KRASKUS_XMR_WALLET_API_PORT: "18420"
      KRASKUS_XMR_VIEW_RPC: "http://wallet-view-rpc:18083/json_rpc"
      KRASKUS_XMR_SPEND_RPC: "http://wallet-spend-rpc:18084/json_rpc"
      KRASKUS_XMR_VIEW_WALLET: "kraskus-xmr-solo-view"
      KRASKUS_XMR_VIEW_PASSWORD_FILE: "/wallets/.view-password"
      KRASKUS_XMR_SPEND_WALLET: "kraskus-xmr-solo"
      KRASKUS_XMR_SPEND_PASSWORD_FILE: "/run/kraskus-secrets/spend-wallet-password"
      KRASKUS_XMR_NODE_STATUS: "http://adapter:18410/api/status"
      KRASKUS_XMR_MONEROD_RPC: "http://monerod:18081/json_rpc"
      KRASKUS_XMR_WALLET_SEND_LOG: "/runtime/wallet-sends.jsonl"
      KRASKUS_XMR_EVENT_LOG: "/runtime/events.jsonl"
      KRASKUS_XMR_WALLET_CONFIG: "/runtime/wallet-config.json"
    volumes:
      - ${APP_DATA_DIR}/wallets:/wallets
      - ${APP_DATA_DIR}/runtime:/runtime
      - ${APP_DATA_DIR}/secrets:/run/kraskus-secrets
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      wallet-view-rpc:
        condition: service_started
      wallet-spend-rpc:
        condition: service_started
      adapter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18420/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_wallet
      - xmr_api

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-ui@sha256:47e36d4225e332c6854b4ecbcec2d05f461c6b1ab51d9c9464eafda33e3ec13c
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/health >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_api

networks:
  xmr_public:
    driver: bridge
  xmr_private:
    driver: bridge
    internal: true
  xmr_api:
    driver: bridge
  xmr_wallet:
    driver: bridge
    internal: true
